<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add to OpenFrame</title>
  <!-- Upload page (SPEC §17): phone-first. Files go one per request as the raw body of
       POST /api/upload?name=&comment= (streams to disk on the frame). Videos larger than 1080p are
       refused here before sending (SPEC §6); the frame checks every video again. -->
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('of-theme') || 'light'; } catch (e) { /* no storage */ }</script>
  <style>
    :root { --bg: #f1f3f4; --card: #fff; --text: #202124; --muted: #5f6368; --line: #e3e3e3;
      --accent: #1a73e8; --ok: #188038; --warn: #b06000; --danger: #d93025; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { min-height: 100vh; padding: 20px 16px 40px; background: var(--bg); color: var(--text); font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { margin: 4px 0 4px; font-size: 26px; }
    .sub { margin: 0 0 18px; color: var(--muted); line-height: 1.4; }
    .card { padding: 18px; border-radius: 18px; background: var(--card); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08); margin-bottom: 14px; }
    .pick { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px 12px; border: 2px dashed #c4c7c5; border-radius: 14px; color: var(--accent); font-size: 18px; font-weight: bold; text-align: center; }
    .pick svg { width: 44px; height: 44px; fill: var(--accent); }
    .pick small { color: var(--muted); font-weight: normal; font-size: 14px; }
    input[type=file] { display: none; }
    label.field { display: block; margin-top: 14px; color: var(--muted); font-size: 14px; }
    html[data-theme="dark"] { --bg: #202124; --card: #2d2e31; --text: #e8eaed; --muted: #9aa0a6; --line: #3c4043;
      --accent: #8ab4f8; --ok: #81c995; --warn: #fdd663; --danger: #f28b82; color-scheme: dark; }
    html[data-theme="dark"] .card { box-shadow: none; }
    html[data-theme="dark"] .pick { border-color: #5f6368; }
    html[data-theme="dark"] textarea { background: #202124; color: var(--text); border-color: #5f6368; }
    html[data-theme="dark"] button.go { color: #202124; }
    html[data-theme="dark"] .thumb { background-color: #3c4043; }
    textarea { width: 100%; min-height: 64px; margin-top: 6px; padding: 10px 12px; border: 1px solid #c4c7c5; border-radius: 10px; font: 16px sans-serif; resize: vertical; }
    textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button.go { width: 100%; height: 52px; margin-top: 14px; border: 0; border-radius: 26px; background: var(--accent); color: #fff; font-size: 17px; font-weight: bold; }
    button.go:disabled { opacity: 0.5; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    li:last-child { border-bottom: 0; }
    .thumb { width: 52px; height: 52px; flex: none; border-radius: 8px; background: #e8eaed center / cover no-repeat; }
    .info { flex: 1; min-width: 0; }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
    .state { margin-top: 3px; color: var(--muted); font-size: 13px; }
    .state.ok { color: var(--ok); }
    .state.dup { color: var(--warn); }
    .state.err { color: var(--danger); }
    .bar { height: 4px; margin-top: 6px; border-radius: 2px; background: var(--line); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
    .summary { font-size: 16px; line-height: 1.45; }
    a { color: var(--accent); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Add to the frame</h1>
    <p class="sub">Photos and videos show up in the slideshow within a few slides.</p>

    <div class="card">
      <label class="pick" for="files">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        <span id="pickLabel">Choose photos and videos</span>
        <small>JPEG, PNG, WebP, MP4, MOV. iPhone photos are converted automatically.</small>
      </label>
      <input id="files" type="file" accept="image/*,video/*" multiple>
      <label class="field" for="comment">Comment (optional, added to each photo in this upload)</label>
      <textarea id="comment" maxlength="500" placeholder="Grandma's birthday"></textarea>
      <button class="go" id="go" type="button" disabled>Upload</button>
    </div>

    <div class="card" id="listCard" hidden>
      <div class="summary" id="summary" hidden></div>
      <ul id="list"></ul>
    </div>
    <p class="sub"><a href="/settings">Settings</a></p>
  </main>

  <script>
    const filesEl = document.getElementById('files');
    const goEl = document.getElementById('go');
    const listEl = document.getElementById('list');
    const listCard = document.getElementById('listCard');
    const summaryEl = document.getElementById('summary');
    const pickLabel = document.getElementById('pickLabel');
    const commentEl = document.getElementById('comment');
    let items = [];
    let busy = false;

    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
    const sizeText = (n) => (n < 1048576 ? `${Math.max(1, Math.round(n / 1024))} KB` : `${(n / 1048576).toFixed(1)} MB`);

    filesEl.addEventListener('change', () => {
      if (busy) return;
      items = [...filesEl.files].map((file) => ({ file }));
      listEl.innerHTML = '';
      summaryEl.hidden = true;
      for (const it of items) {
        const li = el('li');
        const thumb = el('div', 'thumb');
        if (it.file.type.startsWith('image/')) {
          it.url = URL.createObjectURL(it.file);
          thumb.style.backgroundImage = `url("${it.url}")`;
        }
        const info = el('div', 'info');
        it.state = el('div', 'state', `${sizeText(it.file.size)} · waiting`);
        it.bar = el('i');
        const bar = el('div', 'bar');
        bar.append(it.bar);
        info.append(el('div', 'name', it.file.name), it.state, bar);
        li.append(thumb, info);
        listEl.append(li);
      }
      listCard.hidden = items.length === 0;
      goEl.disabled = items.length === 0;
      goEl.textContent = items.length > 1 ? `Upload ${items.length} files` : 'Upload';
      pickLabel.textContent = items.length ? `${items.length} selected · choose again` : 'Choose photos and videos';
    });

    // The frame plays videos up to 1080p (SPEC §6): check before sending a big file it would refuse.
    function videoSize(file) {
      return new Promise((resolve) => {
        const v = document.createElement('video');
        const url = URL.createObjectURL(file);
        const done = (r) => { clearTimeout(t); v.removeAttribute('src'); v.load(); URL.revokeObjectURL(url); resolve(r); };
        const t = setTimeout(() => done(null), 8000);
        Object.assign(v, { preload: 'metadata', muted: true, playsInline: true });
        v.onloadedmetadata = () => done({ w: v.videoWidth, h: v.videoHeight });
        v.onerror = () => done(null); // can't tell here: the frame checks it
        v.src = url;
      });
    }

    async function tooBig(it) {
      if (!it.file.type.startsWith('video/')) return null;
      const s = await videoSize(it.file);
      if (!s || !s.w || (Math.max(s.w, s.h) <= 1920 && Math.min(s.w, s.h) <= 1088)) return null;
      const label = Math.max(s.w, s.h) >= 3800 ? ' (4K)' : '';
      return `This video is ${s.w}×${s.h}${label}; the frame plays videos up to 1080p. Send it with the iPhone Shortcut, which converts it.`;
    }

    function send(it, comment) {
      return new Promise((resolve) => {
        const q = new URLSearchParams({ name: it.file.name });
        if (comment) q.set('comment', comment);
        const xhr = new XMLHttpRequest();
        xhr.open('POST', `/api/upload?${q}`);
        xhr.setRequestHeader('Content-Type', 'application/octet-stream');
        xhr.upload.onprogress = (e) => { if (e.lengthComputable) it.bar.style.width = `${(e.loaded / e.total) * 100}%`; };
        xhr.onload = () => {
          let body = {};
          try { body = JSON.parse(xhr.responseText); } catch (e) { /* not JSON */ }
          if (xhr.status === 401) { location.reload(); return; } // signed out: PIN page
          resolve({ http: xhr.status, body });
        };
        xhr.onerror = () => resolve({ http: 0, body: { error: "Couldn't reach the frame." } });
        xhr.send(it.file);
      });
    }

    goEl.addEventListener('click', async () => {
      if (busy || !items.length) return;
      busy = true;
      goEl.disabled = true;
      filesEl.disabled = true;
      const comment = commentEl.value.trim();
      const counts = { saved: 0, duplicate: 0, failed: 0 };
      for (const it of items) {
        it.state.className = 'state';
        const big = await tooBig(it);
        if (big) {
          counts.failed++;
          it.state.className = 'state err';
          it.state.textContent = big;
          it.bar.style.width = '100%';
          it.bar.style.background = 'var(--danger)';
          continue;
        }
        it.state.textContent = `${sizeText(it.file.size)} · uploading…`;
        const { http, body } = await send(it, comment);
        it.bar.style.width = '100%';
        if (body.status === 'saved') {
          counts.saved++;
          it.state.className = 'state ok';
          it.state.textContent = 'Added';
        } else if (body.status === 'duplicate') {
          counts.duplicate++;
          it.state.className = 'state dup';
          it.state.textContent = 'Already on the frame';
        } else {
          counts.failed++;
          it.state.className = 'state err';
          it.state.textContent = body.error || `Failed (HTTP ${http})`;
          it.bar.style.background = 'var(--danger)';
        }
      }
      const parts = [];
      if (counts.saved) parts.push(`${counts.saved} added`);
      if (counts.duplicate) parts.push(`${counts.duplicate} already on the frame`);
      if (counts.failed) parts.push(`${counts.failed} failed`);
      summaryEl.textContent = `${parts.join(', ')}.`;
      summaryEl.hidden = false;
      busy = false;
      filesEl.disabled = false;
      filesEl.value = '';
      goEl.textContent = 'Upload';
      pickLabel.textContent = 'Choose more photos and videos';
    });
  </script>
  <script type="module">
    // Dark mode follows Settings → Appearance (SPEC §9); theme.js remembers it for the next page.
    import { applyTheme } from '/theme.js';
    Promise.all([fetch('/api/config', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)),
      fetch('/api/weather', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null)])
      .then(([config, weather]) => { if (config) applyTheme(config, weather); }).catch(() => {});
  </script>
</body>
</html>
